<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meatflap Arcade</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hub-header">
    <h1 class="hub-title">MEATFLAP <span>ARCADE</span></h1>
    <p class="hub-subtitle">Small games. No ads. No sign-up. Just play.</p>
  </header>

  <main class="game-grid">
    <a class="game-card" href="games/snake/">
      <div class="game-thumb snake-thumb" aria-hidden="true"></div>
      <h2>Snake</h2>
      <p>Classic grid snake. Arrow keys or swipe.</p>
    </a>

    <a class="game-card" href="games/flappy/">
      <div class="game-thumb flappy-thumb" aria-hidden="true"></div>
      <h2>Flappy Flap</h2>
      <p>Tap to fly. Dodge the pipes.</p>
    </a>

    <div class="game-card game-card--soon">
      <div class="game-thumb soon-thumb" aria-hidden="true">?</div>
      <h2>Coming Soon</h2>
      <p>Got a game idea? Add it to the list.</p>
    </div>
  </main>

  <footer class="hub-footer">
    <p>arcade.meatflap.com</p>
  </footer>
</body>
</html>
