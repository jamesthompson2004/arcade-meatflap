<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meat Breaker — Meatflap Arcade</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="meatbreaker.css">
</head>
<body>
  <a class="back-link" href="../../">← Arcade</a>

  <div class="meatbreaker-wrap">
    <h1>Meat Breaker</h1>
    <p class="lead">Take turns breaking grill grates. Don't be the one who drops the sausage in the coals.</p>

    <div class="hud">
      <span id="turn-label">Your turn</span>
      <div class="heat-meter"><div id="heat-fill" class="heat-fill"></div></div>
      <button id="restart-btn" type="button" class="mini-btn">🔁 New game</button>
    </div>

    <canvas id="board" width="620" height="460"></canvas>

    <div id="overlay" class="overlay hidden">
      <p id="overlay-text">You win!</p>
      <button id="overlay-restart-btn" type="button">Play Again</button>
    </div>
  </div>

  <script src="meatbreaker.js"></script>
</body>
</html>
