<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scout's Big Adventure — Meatflap Arcade</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="scout.css">
</head>
<body>
  <a class="back-link" href="../../">← Arcade</a>

  <div class="scout-wrap">
    <h1>Scout's Big Adventure</h1>
    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Bones: <strong id="bones">0</strong></span>
      <span>Best: <strong id="best">0</strong></span>
    </div>

    <canvas id="board" width="480" height="260"></canvas>

    <p class="hint">Space / Up to jump. Down to duck. Use the buttons or swipe on mobile.</p>

    <div class="touch-controls">
      <button class="touch-btn touch-duck" id="duck-btn" aria-label="Duck">▼ Duck</button>
      <button class="touch-btn touch-jump" id="jump-btn" aria-label="Jump">▲ Jump</button>
    </div>

    <div id="overlay" class="overlay">
      <p id="overlay-text">Scout smells an adventure.</p>
      <p id="overlay-sub">Jump the junk, duck the branches, grab every bone.</p>
      <button id="restart-btn">Let's Go</button>
    </div>
  </div>

  <script src="scout.js"></script>
</body>
</html>
