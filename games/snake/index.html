<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake — Meatflap Arcade</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="snake.css">
</head>
<body>
  <a class="back-link" href="../../">← Arcade</a>

  <div class="snake-wrap">
    <h1>Snake</h1>
    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Best: <strong id="best">0</strong></span>
    </div>

    <canvas id="board" width="400" height="400"></canvas>

    <p class="hint">Arrow keys / WASD to move. Swipe on mobile. Space to restart.</p>

    <div id="overlay" class="overlay hidden">
      <p id="overlay-text">Game Over</p>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script src="snake.js"></script>
</body>
</html>
